name: Publish Guard (双闸)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  double-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Quality Gate (21关)
        run: python3 scripts/quality_gate.py --all
      - name: Stability Guard (11项 BLOCKER 拦截)
        run: python3 scripts/stability_guard.py --all
